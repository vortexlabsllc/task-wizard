database:
  # type: postgres (default) | sqlite
  type: postgres
  # Full DSN connection strings (cloud-native friendly, SSL options included).
  # dsn is the primary read-write connection (required for postgres).
  # dsn_r (optional) serves ordinary reads; dsn_ro (optional) serves
  # heavy/reporting reads. Each falls back to the previous tier when unset.
  # All values can be injected via TW_DATABASE_DSN / TW_DATABASE_DSN_R /
  # TW_DATABASE_DSN_RO.
  dsn: "postgres://user:pass@localhost:5432/taskwizard?sslmode=require"
  # dsn_r: "postgres://ro_user:pass@replica1:5432/taskwizard?sslmode=require"
  # dsn_ro: "postgres://report_user:pass@replica2:5432/taskwizard?sslmode=require"
  migration: true
  # sqlite only (use type: sqlite for local zero-config development):
  # path: /config/task-wizard.db
entra:
  enabled: false
  # Omit tenant_id to allow all Entra tenants and personal Microsoft accounts.
  tenant_id: ""
  client_id: ""
  audience: ""
  issuer: ""
server:
  host_name: example.com
  port: 2021
  read_timeout: 2s
  write_timeout: 1s
  rate_period: 60s
  rate_limit: 300
  serve_frontend: true
  registration: true
  log_level: "warn"
  trusted_proxies: []
scheduler_jobs:
  due_frequency: 5m
  overdue_frequency: 24h
  notification_cleanup: 10m
