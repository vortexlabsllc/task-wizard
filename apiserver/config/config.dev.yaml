database:
  # Local development default: zero-config single-file SQLite.
  # For Postgres, set type: postgres and dsn (see config.yaml for the
  # full DSN / read-replica documentation).
  type: sqlite
  migration: true
  path: task-wizard.db
server:
  host_name: localhost
  port: 2021
  read_timeout: 2s
  write_timeout: 1s
  rate_period: 60s
  rate_limit: 300
  serve_frontend: false
  registration: true
  log_level: "debug"
  allow_insecure_no_auth: true
  allowed_origins:
    - http://localhost:5173
  allow_cors_credentials: true
  trusted_proxies: []
scheduler_jobs:
  due_frequency: 1m
  overdue_frequency: 1m
  notification_cleanup: 10s
